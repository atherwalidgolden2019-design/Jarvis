<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03080f;
    --panel: rgba(10, 28, 44, 0.65);
    --line: rgba(80, 220, 255, 0.25);
    --cyan: #4be3ff;
    --cyan-soft: rgba(75, 227, 255, 0.55);
    --amber: #ffb347;
    --text: #d6f4ff;
    --dim: #6f93a6;
    --state: var(--cyan);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { height: 100dvh; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body {
    background:
      radial-gradient(ellipse at 50% 30%, #0a2237 0%, var(--bg) 65%),
      var(--bg);
    color: var(--text);
    font-family: "Rajdhani", system-ui, sans-serif;
    font-size: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  body::before { /* faint grid */
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.08;
    mask-image: radial-gradient(circle at 50% 35%, #000, transparent 75%);
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: calc(14px + env(safe-area-inset-top)) 24px 14px; border-bottom: 1px solid var(--line);
    font-family: "Orbitron", sans-serif; letter-spacing: 0.3em; font-size: 14px;
    color: var(--cyan);
  }
  #status { color: var(--dim); letter-spacing: 0.2em; font-size: 12px; text-transform: uppercase; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; min-height: 0; padding: 12px 16px 0; }

  /* ---- Arc reactor orb ---- */
  .orb-wrap { position: relative; width: 190px; height: 190px; flex: none; margin: 8px 0 4px; cursor: pointer; }
  .ring, .core { position: absolute; border-radius: 50%; }
  .ring { inset: 0; border: 2px solid transparent; border-top-color: var(--state); border-bottom-color: var(--state); animation: spin 8s linear infinite; }
  .ring.r2 { inset: 16px; border-top-color: transparent; border-left-color: var(--state); border-right-color: var(--state); animation: spin 5s linear infinite reverse; opacity: .8; }
  .ring.r3 { inset: 34px; border: 1px dashed var(--cyan-soft); animation: spin 20s linear infinite; }
  .core {
    inset: 56px;
    background: radial-gradient(circle, #fff 0%, var(--state) 35%, rgba(75,227,255,0.05) 75%);
    box-shadow: 0 0 40px var(--state), 0 0 90px rgba(75,227,255,0.35);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(0.88); opacity: .8; } }
  body[data-state="listening"] { --state: #5dff9f; }
  body[data-state="listening"] .core { animation-duration: 0.9s; }
  body[data-state="thinking"] { --state: var(--amber); }
  body[data-state="thinking"] .ring { animation-duration: 1.6s; }
  body[data-state="thinking"] .ring.r2 { animation-duration: 1.1s; }
  body[data-state="speaking"] .core { animation-duration: 0.5s; }

  #caption {
    min-height: 28px; text-align: center; color: var(--dim);
    font-size: 15px; letter-spacing: .08em; margin-bottom: 8px; max-width: 700px;
  }

  /* ---- Conversation ---- */
  #log {
    flex: 1; width: 100%; max-width: 760px; overflow-y: auto; min-height: 0;
    padding: 4px 6px 12px; display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .msg { padding: 10px 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); max-width: 88%; line-height: 1.35; backdrop-filter: blur(6px); }
  .msg.user { align-self: flex-end; border-color: rgba(255,255,255,.18); }
  .msg.jarvis { align-self: flex-start; border-left: 3px solid var(--cyan); }
  .msg.sys { align-self: center; color: var(--dim); font-size: 14px; border-style: dashed; background: none; }
  .msg .who { display: block; font-family: "Orbitron", sans-serif; font-size: 10px; letter-spacing: .25em; color: var(--dim); margin-bottom: 4px; }

  /* ---- Controls ---- */
  footer { width: 100%; max-width: 760px; padding: 10px 6px calc(18px + env(safe-area-inset-bottom)); }
  .msg a { color: var(--cyan); }
  body.ios #wake { display: none; }
  input[type=text] { font-size: 16px; } /* stops iOS zooming into the field */
  form { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 12px 14px; font: inherit; border-radius: 4px; outline: none;
  }
  input[type=text]:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(75,227,255,.25); }
  button {
    background: var(--panel); border: 1px solid var(--line); color: var(--cyan);
    font-family: "Orbitron", sans-serif; letter-spacing: .15em; font-size: 12px;
    padding: 0 16px; border-radius: 4px; cursor: pointer; min-height: 44px; transition: .15s;
  }
  button:hover { border-color: var(--cyan); box-shadow: 0 0 14px rgba(75,227,255,.3); }
  button.on { background: rgba(93,255,159,.15); border-color: #5dff9f; color: #5dff9f; }
  .toggles { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .toggles button { min-height: 36px; font-size: 11px; }
  @media (max-width: 520px) {
    .orb-wrap { width: 140px; height: 140px; }
    .core { inset: 42px; } .ring.r2 { inset: 12px; } .ring.r3 { inset: 26px; }
  }
  @media (prefers-reduced-motion: reduce) { .ring, .core { animation: none !important; } }
</style>
</head>
<body data-state="idle">
<header>
  <span>J.A.R.V.I.S.</span>
  <span id="status">Systems online</span>
</header>

<main>
  <div class="orb-wrap" id="orb" title="Click to talk" role="button" aria-label="Talk to Jarvis">
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div>
  </div>
  <div id="caption">Click the reactor or say "Jarvis" to begin</div>
  <div id="log" aria-live="polite"></div>

  <footer>
    <form id="form">
      <input type="text" id="input" placeholder="Type a command…" autocomplete="off" aria-label="Command">
      <button type="button" id="mic">MIC</button>
      <button type="submit">SEND</button>
    </form>
    <div class="toggles">
      <button type="button" id="wake">WAKE WORD: OFF</button>
      <button type="button" id="mute">VOICE: ON</button>
      <button type="button" id="clear">CLEAR</button>
    </div>
  </footer>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), caption = $("caption"), statusEl = $("status");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let history = [];
  let voiceOn = true;
  let wakeMode = false;
  let busy = false;
  let speaking = false;
  let oneShot = false;
  let awaitingCommand = false;
  let awaitTimer = null;
  let recog = null;
  let recogRunning = false;
  const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (IOS) document.body.classList.add("ios"); // iOS Safari can't listen continuously
  const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
  let needsCode = false;
  const getCode = () => { try { return localStorage.getItem("jarvis_code") || ""; } catch (_) { return ""; } };
  const saveCode = (c) => { try { localStorage.setItem("jarvis_code", c); } catch (_) {} };
  function askCode() {
    const c = prompt("Enter your Jarvis access code");
    if (c) saveCode(c.trim());
    return !!c;
  }
  // iOS only lets speech play after a tap; unlock it on the first touch.
  let unlocked = false;
  function unlockSpeech() {
    if (unlocked || !("speechSynthesis" in window)) return;
    unlocked = true;
    const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u);
  }
  document.addEventListener("touchstart", unlockSpeech, {once: true});
  document.addEventListener("click", unlockSpeech, {once: true});

  function setState(s, text) {
    document.body.dataset.state = s;
    statusEl.textContent = text || ({idle: "Systems online", listening: "Listening", thinking: "Processing", speaking: "Speaking"})[s];
  }
  function addMsg(kind, text) {
    const d = document.createElement("div");
    d.className = "msg " + kind;
    if (kind !== "sys") {
      const w = document.createElement("span");
      w.className = "who"; w.textContent = kind === "user" ? "YOU" : "JARVIS";
      d.appendChild(w);
    }
    d.appendChild(document.createTextNode(text));
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  /* ---------- Speech output ---------- */
  let voice = null;
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /en-GB/i.test(v.lang) && /male|daniel|george|ryan/i.test(v.name))
         || vs.find(v => /en-GB/i.test(v.lang))
         || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  function speak(text, done) {
    if (!voiceOn || !("speechSynthesis" in window)) { done && done(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.rate = 1.02; u.pitch = 0.9;
    u.onstart = () => { speaking = true; setState("speaking"); };
    const end = () => { speaking = false; setState(wakeMode ? "listening" : "idle"); done && done(); };
    u.onend = end; u.onerror = end;
    speechSynthesis.speak(u);
  }

  /* ---------- Talking to the backend ---------- */
  async function ask(text) {
    if (!text.trim() || busy) return;
    busy = true;
    addMsg("user", text);
    history.push({role: "user", content: text});
    setState("thinking"); caption.textContent = "Working on it…";
    try {
      if (needsCode && !getCode() && !askCode()) throw new Error("An access code is required.");
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json", "X-Access-Code": getCode()},
        body: JSON.stringify({messages: history, tz: TZ}),
      });
      const data = await r.json();
      if (r.status === 401) { saveCode(""); throw new Error("Wrong access code. Send your message again to retry."); }
      if (!r.ok) throw new Error(data.error || "Request failed");
      history.push({role: "assistant", content: data.reply});
      addMsg("jarvis", data.reply);
      caption.textContent = "";
      (data.actions || []).forEach(runAction);
      busy = false;
      speak(data.reply);
      if (!voiceOn) setState(wakeMode ? "listening" : "idle");
    } catch (e) {
      busy = false;
      history.pop();
      addMsg("sys", "Error: " + e.message);
      setState(wakeMode ? "listening" : "idle");
      caption.textContent = "";
    }
  }

  function runAction(a) {
    if (a.type === "open_url") {
      // Phones block pop-ups after async work, so also show a tappable link.
      const d = document.createElement("div");
      d.className = "msg sys";
      const link = document.createElement("a");
      link.href = a.url; link.target = "_blank"; link.rel = "noopener";
      link.textContent = "Tap to open " + a.url.replace(/^https?:\/\//, "");
      d.appendChild(link); log.appendChild(d); log.scrollTop = log.scrollHeight;
      try { window.open(a.url, "_blank", "noopener"); } catch (_) {}
    }
    if (a.type === "reminder") {
      setTimeout(() => {
        const msg = "Reminder: " + a.text;
        addMsg("jarvis", msg);
        speak(msg);
        if ("Notification" in window && Notification.permission === "granted") new Notification("Jarvis", {body: a.text});
      }, a.seconds * 1000);
      if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
    }
  }

  /* ---------- Speech input ---------- */
  function setupRecog() {
    if (!SR) return null;
    const r = new SR();
    r.lang = "en-US";
    r.interimResults = false;
    r.onstart = () => { recogRunning = true; if (!speaking && !busy) setState("listening"); };
    r.onend = () => {
      recogRunning = false;
      if (!speaking && !busy) setState("idle");
      if (wakeMode) setTimeout(startRecog, 300); // keep listening for the wake word
      else $("mic").classList.remove("on");
    };
    r.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        wakeMode = false; syncWake();
        addMsg("sys", "Microphone access was blocked. Allow it in the browser address bar.");
      }
    };
    r.onresult = (ev) => {
      const res = ev.results[ev.results.length - 1];
      if (!res.isFinal) return;
      handleHeard(res[0].transcript.trim());
    };
    return r;
  }

  function handleHeard(text) {
    if (!text || speaking || busy) return;
    if (oneShot) { oneShot = false; ask(text); return; }
    if (!wakeMode) return;
    const m = text.match(/\bjarvis\b[,.!?]?\s*(.*)/i);
    if (awaitingCommand) { awaitingCommand = false; clearTimeout(awaitTimer); ask(m ? (m[1] || text) : text); return; }
    if (!m) return;
    if (m[1]) { ask(m[1]); return; }
    awaitingCommand = true;
    caption.textContent = "Yes?";
    speak("Yes?");
    awaitTimer = setTimeout(() => { awaitingCommand = false; caption.textContent = ""; }, 8000);
  }

  function startRecog() {
    if (!recog || recogRunning) return;
    try { recog.continuous = wakeMode; recog.start(); } catch (_) {}
  }

  function syncWake() {
    const b = $("wake");
    b.textContent = "WAKE WORD: " + (wakeMode ? "ON" : "OFF");
    b.classList.toggle("on", wakeMode);
    caption.textContent = wakeMode ? 'Say "Jarvis" followed by your request' : "";
  }

  /* ---------- Wiring ---------- */
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const t = input.value; input.value = ""; ask(t);
  });
  function pushToTalk() {
    if (!SR) { addMsg("sys", "Voice input needs Chrome or Edge. You can still type."); return; }
    speechSynthesis.cancel();
    oneShot = true; $("mic").classList.add("on");
    if (recogRunning) { try { recog.stop(); } catch (_) {} setTimeout(startRecog, 350); } else startRecog();
  }
  $("mic").addEventListener("click", pushToTalk);
  $("orb").addEventListener("click", pushToTalk);
  $("wake").addEventListener("click", () => {
    if (!SR) { addMsg("sys", "Wake word needs Chrome or Edge."); return; }
    wakeMode = !wakeMode; syncWake();
    if (wakeMode) startRecog(); else { try { recog.stop(); } catch (_) {} }
  });
  $("mute").addEventListener("click", () => {
    voiceOn = !voiceOn; $("mute").textContent = "VOICE: " + (voiceOn ? "ON" : "OFF");
    $("mute").classList.toggle("on", voiceOn);
    if (!voiceOn) speechSynthesis.cancel();
  });
  $("clear").addEventListener("click", () => { history = []; log.innerHTML = ""; });

  recog = setupRecog();
  $("mute").classList.add("on");
  if (!SR) addMsg("sys", "Voice input isn't supported in this browser. Use Chrome or Edge for voice; typing works everywhere.");
  fetch("/api/health").then(r => r.json()).then(h => {
    needsCode = !!h.needs_code;
    if (IOS) caption.textContent = "Tap the reactor and speak";
    if (!h.has_key) addMsg("sys", "No API key found. Add ANTHROPIC_API_KEY to your .env file and restart the server.");
    else {
      const greeting = "Good " + (new Date().getHours() < 12 ? "morning" : new Date().getHours() < 18 ? "afternoon" : "evening") + ". All systems are online. How may I assist?";
      addMsg("jarvis", greeting);
    }
  }).catch(() => addMsg("sys", "Can't reach the Jarvis server. Is server.py running?"));
})();
</script>
</body>
</html>
